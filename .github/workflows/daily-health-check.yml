name: Daily health check

# Demo/reference automation: runs the assistant's unit tests plus npm audit
# for tools/ (parity harness) and console/ (Appendix A2 React component) on
# this branch. Never writes code or auto-implements roadmap items -- see
# docs/ROADMAP.md on main for planned work, which stays human-driven. Opens
# or updates a single tracking issue with the day's status; does not fail
# the workflow run just because one step fails, so the issue reflects
# reality instead of only the first failure.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assistant CLI - unit tests
        id: assistant_test
        continue-on-error: true
        run: python -m unittest test_core -v

      - name: Parity harness (tools/) - install
        id: tools_install
        continue-on-error: true
        working-directory: tools
        run: npm install

      - name: Parity harness (tools/) - audit
        id: tools_audit
        continue-on-error: true
        working-directory: tools
        run: npm audit

      - name: React console (console/) - install
        id: console_install
        continue-on-error: true
        working-directory: console
        run: npm install

      - name: React console (console/) - audit
        id: console_audit
        continue-on-error: true
        working-directory: console
        run: npm audit

      - name: Build status report
        id: report
        if: always()
        run: |
          {
            echo "### Daily health check — $(date -u +%Y-%m-%d) (Exec-Assistant)"
            echo ""
            echo "| Product | Step | Result |"
            echo "|---|---|---|"
            echo "| Assistant CLI | unittest | ${{ steps.assistant_test.outcome }} |"
            echo "| Parity harness (tools/) | install | ${{ steps.tools_install.outcome }} |"
            echo "| Parity harness (tools/) | audit | ${{ steps.tools_audit.outcome }} |"
            echo "| React console (console/) | install | ${{ steps.console_install.outcome }} |"
            echo "| React console (console/) | audit | ${{ steps.console_audit.outcome }} |"
            echo ""
            echo "\`console/\` has no build step by design (Appendix A2 component + docs only, no wired entry point)."
            echo ""
            echo "_Automated report — no code was changed. See docs/ROADMAP.md on main for planned work._"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Daily health check (Exec-Assistant)"
          NUMBER=$(gh issue list --search "$TITLE in:title" --state open --json number,title --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -n1)
          if [ -z "$NUMBER" ]; then
            gh issue create --title "$TITLE" --body-file report.md
          else
            gh issue edit "$NUMBER" --body-file report.md
          fi
