name: Daily health check

# Demo/reference automation: runs build + test + npm audit for the
# Spec-Ingest Tool scaffold on this branch. Never writes code or
# auto-implements roadmap items -- see docs/ROADMAP.md on main for planned
# work, which stays human-driven. Opens or updates a single tracking issue
# with the day's status; does not fail the workflow run just because one
# step fails, so the issue reflects reality instead of only the first
# failure.

on:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        id: install
        continue-on-error: true
        run: npm install

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Test
        id: test
        continue-on-error: true
        run: npm test

      - name: Audit
        id: audit
        continue-on-error: true
        run: npm audit

      - name: UI syntax check
        id: ui_check
        continue-on-error: true
        run: node --check ingestRunner.mjs && node --check ui/server.mjs

      - name: UI Docker image build
        id: ui_docker
        continue-on-error: true
        run: docker build -f ui/Dockerfile -t spec-ingest-ui-health-check .

      - name: Build status report
        id: report
        if: always()
        run: |
          {
            echo "### Daily health check — $(date -u +%Y-%m-%d) (Ingest)"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| install | ${{ steps.install.outcome }} |"
            echo "| build | ${{ steps.build.outcome }} |"
            echo "| test | ${{ steps.test.outcome }} |"
            echo "| audit | ${{ steps.audit.outcome }} |"
            echo "| ui syntax check | ${{ steps.ui_check.outcome }} |"
            echo "| ui docker build | ${{ steps.ui_docker.outcome }} |"
            echo ""
            echo "_Automated report — no code was changed. See docs/ROADMAP.md on main for planned work._"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Daily health check (Ingest)"
          NUMBER=$(gh issue list --search "$TITLE in:title" --state open --json number,title --jq '.[] | select(.title == "'"$TITLE"'") | .number' | head -n1)
          if [ -z "$NUMBER" ]; then
            gh issue create --title "$TITLE" --body-file report.md
          else
            gh issue edit "$NUMBER" --body-file report.md
          fi
