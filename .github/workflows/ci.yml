name: CI

# Runs on every push and pull request that touches main. Unlike
# daily-health-check.yml (scheduled, always green, reports status via a
# tracking issue), this workflow fails the run — and blocks a PR merge — on
# any real failure. It never writes code; it only validates what a human
# already wrote/changed. See docs/CONTRIBUTING.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ingest-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm audit

  addressing-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
      - run: npm run lint
      - run: npm audit

  exec-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: python -m unittest test_core -v

  parity-harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm audit

  react-console-appendix:
    runs-on: ubuntu-latest
    # console/ holds only the Appendix A2 component + docs, no wired entry
    # point (no index.html/main.tsx) — install + audit only, no build.
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm audit
